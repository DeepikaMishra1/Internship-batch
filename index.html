
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }

        h1 {
            text-align: center;
            color: #1d4ed8;
        }

        h2 {
            color: #334155;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #dbeafe;
        }

        .delete-btn {
            background: #dc2626;
            padding: 7px 12px;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        #message {
            color: #15803d;
            margin-top: 12px;
        }

        .empty {
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Employee Management System</h1>

        <h2>Add Employee</h2>

        <form id="employeeForm">

            <div class="form-group">
                <label for="empId">Employee ID</label>
                <input type="text" id="empId"
                       placeholder="Enter employee ID" required>
            </div>

            <div class="form-group">
                <label for="empName">Employee Name</label>
                <input type="text" id="empName"
                       placeholder="Enter employee name" required>
            </div>

            <div class="form-group">
                <label for="empRole">Employee Role</label>
                <select id="empRole" required>
                    <option value="">Select Role</option>
                    <option value="Developer">Developer</option>
                    <option value="Tester">Tester</option>
                    <option value="Manager">Manager</option>
                    <option value="Data Analyst">Data Analyst</option>
                    <option value="HR">HR</option>
                </select>
            </div>

            <div class="form-group">
                <label for="empSalary">Employee Salary</label>
                <input type="number" id="empSalary"
                       placeholder="Enter salary"
                       min="1" required>
            </div>

            <button type="submit">Add Employee</button>

            <p id="message" role="status"></p>

        </form>

        <hr>

        <h2>Employee List</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Salary</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="employeeTable">
                    <tr>
                        <td colspan="5" class="empty">
                            No employees added yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const form = document.getElementById("employeeForm");
        const table = document.getElementById("employeeTable");
        const message = document.getElementById("message");

        let employees = [];

        form.addEventListener("submit", function(event) {

            event.preventDefault();

            const id = document.getElementById("empId").value.trim();
            const name = document.getElementById("empName").value.trim();
            const role = document.getElementById("empRole").value;
            const salary = Number(
                document.getElementById("empSalary").value
            );

            if (!id || !name || !role || salary <= 0) {
                message.textContent = "Please enter valid details.";
                return;
            }

            const exists = employees.some(function(employee) {
                return employee.id.toLowerCase() === id.toLowerCase();
            });

            if (exists) {
                message.textContent = "Employee ID already exists!";
                return;
            }

            const employee = {
                id: id,
                name: name,
                role: role,
                salary: salary
            };

            employees.push(employee);

            displayEmployees();

            form.reset();
            message.textContent = "Employee added successfully!";
        });

        function displayEmployees() {

            table.replaceChildren();

            if (employees.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 5;
                cell.className = "empty";
                cell.textContent = "No employees added yet.";

                row.appendChild(cell);
                table.appendChild(row);
                return;
            }

            employees.forEach(function(employee, index) {

                const row = document.createElement("tr");

                [employee.id, employee.name, employee.role,
                 "₹" + employee.salary].forEach(function(value) {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.addEventListener("click", function() {
                    employees.splice(index, 1);
                    displayEmployees();
                    message.textContent = "Employee deleted.";
                });

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                table.appendChild(row);
            });
        }
    </script>

</body>
</html>
